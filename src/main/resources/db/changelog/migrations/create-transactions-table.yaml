databaseChangeLog:
  - changeSet:
      id: 3
      author: Nikita-Shamatulskij
      changes:
        - createTable:
            tableName: transactions
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: sender_wallet_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_transactions_sender
                    referencedTableName: wallets
                    referencedColumnNames: id
              - column:
                  name: receiver_wallet_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_transactions_receiver
                    referencedTableName: wallets
                    referencedColumnNames: id
              - column:
                  name: amount
                  type: NUMERIC(19, 4)
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false
